    <main class="join-container">
        
        <form action="thankyou.html" method="get" class="join-form">
            <h1 class="page-title">Join the Chamber</h1>
            <label>
                First Name
                <input type="text" name="firstName" title="Applicant's First Name" autocomplete="given-name" placeholder="first name" required>
            </label>
        
            <label>
                Last Name
                <input type="text" name="lastName" title="Applicant's Last Name" autocomplete="family-name" placeholder="last name" required>
            </label>
        
        <label>
            Organizational Title
            <input type="text" name="orgTitle" autocomplete="organization-title" placeholder="eg. Sales Manager"
                pattern="[A-Za-z\s\-]{7,}"
                title="Organizational Title within organization. Minimum 7 characters. Only letters, spaces, and hyphens allowed.">
        </label>
        
            <label>
                Email Address
                <input type="email" name="email" title="Applicant's Email Address" autocomplete="email"
                    placeholder="example@domain.com" required>
            </label>
        
            <label>
                Mobile Phone Number
                <input type="tel" name="phone" title="Applicant's Mobile Phone Number" autocomplete="tel" placeholder="(555)-555-5555" required>
            </label>
        
            <label>
                Business/Organization Name
                <input type="text" name="organization" title="Business or Organization Name" autocomplete="organization"
                    placeholder="business or organization name" required>
            </label>
        
            <label>
                Membership Level
                <select name="membershipLevel" title="Select a Membership Level" required>
                    <option value="" disabled selected>Select a level...</option>
                    <option value="np">NP Membership (Non-Profit - No Fee)</option>
                    <option value="bronze">Bronze Membership</option>
                    <option value="silver">Silver Membership</option>
                    <option value="gold">Gold Membership</option>
                </select>
            </label>
        
            <label>
                Business/Organization Description
                <textarea name="description" title="Description of the business or organization" rows="4" placeholder="Describe your business or organization"></textarea>
            </label>
        
            
            <input type="hidden" name="timestamp" id="timestamp">
        
            <input type="submit" value="Submit Application" class="submit-btn">
        </form>
        
       
    <section class="membership-sidebar">
        <h2>Membership Levels</h2>
        <div class="cards-grid">
            <div class="membership-card">
                <h3>NP Membership</h3>
                <button type="button" class="modal-link" data-membership="np">Get Additional Information</button>
            </div>
            <div class="membership-card">
                <h3>Bronze Membership</h3>
                <button type="button" class="modal-link" data-membership="bronze">Get Additional Information</button>
            </div>
            <div class="membership-card silver">
                <h3>Silver Membership</h3>
                <button type="button" class="modal-link" data-membership="silver">Get Additional Information</button>
            </div>
            <div class="membership-card gold">
                <h3>Gold Membership</h3>
                <button type="button" class="modal-link" data-membership="gold">Get Additional Information</button>
            </div>
        </div>
    </section>

       
        
        
    <dialog id="membership-modal">
        <button type="button" class="modal-close-btn" id="close-modal-btn">Close</button>
        <div id="modal-content"></div>
    </dialog>
